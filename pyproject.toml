[project]
name = "motivs-factura-backend"
version = "0.1.0"
description = "FastAPI backend for Motivs Factura, Spain electricity contract intelligence."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.4.0",
  "orjson>=3.10.0",
  "pyyaml>=6.0",
  "lancedb>=0.15.0",
  "pyarrow>=15.0.0",
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "pdfplumber>=0.11.0",
  "pytesseract>=0.3.10",
  "pillow>=10.4.0",
  "motivs-sre @ git+https://github.com/Rizos13/Motivs_SRE.git@v0.5.0#subdirectory=packages/core",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.24.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_default_fixture_loop_scope = "function"
