apiVersion: motivs.io/v1
kind: DeliveryContract
metadata:
  tenant_id: ofertas-es
  client_name: electricity-factura.motivs.ai cnmc ofertas
  version: "2.0"

spec:
  source:
    type: file_upload
    expected:
      size_kb: { min: 1, max: 200 }
      rows:    { min: 1, max: 200 }

  schema:
    fields:
      - name: offer_id
        type: string
        required: true
        unique: true
        pattern: "^[a-f0-9]{8,64}$"

      - name: comercializadora
        type: string
        required: true
        max_length: 200

      - name: oferta
        type: string
        required: true
        max_length: 200

      - name: tipo_precio
        type: string
        required: true
        allowed_values: [fijo, flexible, pvpc]

      - name: importe_primera_factura_eur
        type: decimal
        required: true
        validation: { min: 0, max: 10000 }

      - name: descuento_promocional_eur
        type: decimal
        required: false
        validation: { min: 0, max: 10000 }

      - name: validez_texto
        type: string
        required: false
        max_length: 500

      - name: servicios_adicionales
        type: string
        required: false
        max_length: 200

      - name: penalizacion
        type: string
        required: true
        allowed_values: [si, no]

      - name: verde
        type: string
        required: true
        allowed_values: [si, no]

      - name: snapshot_date
        type: date
        required: true

  transformations:
    - type: deduplicate
      field: offer_id
    - type: normalize_date
      field: snapshot_date
      format: ISO8601

  delivery:
    target: jsonl_offers_cache
    format: csv
    deadline: same_day
